services:
  # CF Worker deploy service (one-off, orchestrated by ./deploy.sh)
  # Not started by docker compose up; must be invoked explicitly via the deploy profile
  deploy:
    build:
      context: .
      dockerfile: Dockerfile.deploy
    env_file: .env
    volumes:
      - ./.env:/app/.env
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-${CF_ACCOUNT_ID:-}}
    restart: "no"
    profiles:
      - deploy

  # Telegram Local Bot API: lifts the file size limit (20MB -> 2GB)
  # Requires TELEGRAM_API_ID and TELEGRAM_API_HASH (get them at https://my.telegram.org)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_LOCAL=1
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    deploy:
      resources:
        limits:
          memory: 512M
    profiles:
      - localapi

  # VPS local processing service (large files + media processing)
  # Tunnel and Caddy reach it over the internal Docker network; no host ports need to be exposed
  # For direct access while debugging: docker compose run -p 3000:3000 processor
  processor:
    build: ./processor
    restart: unless-stopped
    environment:
      - PORT=3000
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - AUTH_SECRET=${VPS_SECRET}
      - TG_LOCAL_API=${TG_LOCAL_API:-https://api.telegram.org}
      - DEFAULT_CHAT_ID=${DEFAULT_CHAT_ID}
      - TEMP_DIR=/tmp/tg-s3
    volumes:
      - processor-data:/tmp/tg-s3
    deploy:
      resources:
        limits:
          memory: 2G

  # Cloudflare Tunnel: securely exposes processor to the CF Worker without opening public ports
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      - processor
    profiles:
      - tunnel

volumes:
  processor-data:
  tg-bot-api-data:
